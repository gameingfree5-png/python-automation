name: Python Daily Demo

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  run-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Run Python
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          print("Automation chal gaya!")
          print(datetime.now(timezone.utc))
          PY
