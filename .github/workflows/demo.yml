name: Server Playlist Every 5 Hours

on:
  workflow_dispatch:
  schedule:
    # Check hourly and sync every fifth hour across midnight.
    - cron: "30 * * * *"

concurrency:
  group: demo-refresh
  cancel-in-progress: false

jobs:
  sync-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PLAYLIST_SOURCE_URL: ${{ vars.PLAYLIST_SOURCE_URL }}
    steps:
      - name: Check 5-hour interval
        id: interval
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          slot = int((datetime.now(timezone.utc).timestamp() - 1800) // 3600)
          due = os.environ["EVENT_NAME"] == "workflow_dispatch" or slot % 5 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"due={str(due).lower()}\n")
          print("Sync is due." if due else "Waiting for the next 5-hour slot.")
          PY

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Validate sync script syntax
        run: python3 -m py_compile sync_playlist.py

      - name: Await server configuration
        if: env.PLAYLIST_SOURCE_URL == ''
        run: echo "Set repository variable PLAYLIST_SOURCE_URL to your server JSON endpoint. Existing playlist is preserved."

      - name: Fetch server playlist
        if: steps.interval.outputs.due == 'true' && env.PLAYLIST_SOURCE_URL != ''
        run: python3 sync_playlist.py

      - name: Save playlist and refresh status
        if: steps.interval.outputs.due == 'true' && env.PLAYLIST_SOURCE_URL != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.json demo-status.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh server playlist and status"
            git push origin HEAD:main
          fi
