name: Python Every 5 Hours

on:
  workflow_dispatch:
  schedule:
    # Hourly checks keep the 5-hour interval continuous across midnight.
    - cron: "30 * * * *"

concurrency:
  group: demo-refresh
  cancel-in-progress: false

jobs:
  run-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check 5-hour interval
        id: interval
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          slot = int((now.timestamp() - 1800) // 3600)
          due = os.environ["EVENT_NAME"] == "workflow_dispatch" or slot % 5 == 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"due={str(due).lower()}\n")
          print("Demo is due." if due else "Waiting for the next 5-hour slot.")
          PY

      - name: Checkout repository
        if: steps.interval.outputs.due == 'true'
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Refresh demo status
        if: steps.interval.outputs.due == 'true'
        run: python3 demo.py

      - name: Save refreshed status
        if: steps.interval.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo-status.json
          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "Refresh demo status"
            git push origin HEAD:main
          fi
